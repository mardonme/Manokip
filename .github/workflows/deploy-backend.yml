name: Deploy backend (manual)

# Backend is deployed ONLY by hand: open the Actions tab → "Deploy backend
# (manual)" → "Run workflow". Rebuilding the API touches the live Postgres, so
# this is never automatic.
#
# Schema changes go through migration history: the api container runs
# `prisma migrate deploy` on start (see the `command:` in the VPS
# /opt/manokip/docker-compose.yml, mirrored at deploy/docker-compose.prod.yml).
# The pre-existing db-push database was baselined once on 2026-08-03 with
#   docker compose run --rm api npx prisma migrate resolve --applied 20260627000000_init
# so `migrate deploy` only applies what came after it. A migration that would
# drop data still applies — review prisma/migrations/ before running this.
#
# Runs on the SELF-HOSTED runner on the VPS, so every step is local — no SSH,
# no DEPLOY_* secrets. It syncs server/ into /opt/manokip/server, then rebuilds
# & restarts the `api` container. Production secrets (/opt/manokip/.env),
# uploads, and the DB volume are left untouched.

on:
  workflow_dispatch:
    inputs:
      reseed:
        description: 'Reseed the database after deploy (DANGER — overwrites seed data)'
        type: boolean
        default: false

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    # The `manokip` label pins this to THIS repo's runner on the shared VPS.
    runs-on: [self-hosted, manokip]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync server/ source
        # Local rsync on the VPS. --delete keeps the deploy dir in sync, but the
        # excluded paths are protected from deletion: prod .env, uploads,
        # node_modules, dev DB, logs.
        run: |
          rsync -a --delete \
            --exclude node_modules --exclude .env --exclude uploads \
            --exclude 'prisma/dev.db*' --exclude '*.log' \
            server/ /opt/manokip/server/

      - name: Rebuild & restart API
        run: cd /opt/manokip && docker compose up -d --build api

      - name: Apply catalog images
        # Idempotent and non-destructive: copies prisma/catalog-images/ into the
        # uploads volume and fills imageUrl only where it is still empty —
        # images picked through the admin panel are never overwritten.
        run: docker exec -w /app/server manokip-api npm run apply-images

      - name: Reseed database (optional)
        if: ${{ inputs.reseed }}
        run: docker exec -w /app/server manokip-api npm run seed

      - name: Summary
        run: echo "✅ Backend (api) rebuilt and restarted on the VPS"
